[project]
name = "login-automation"
version = "0.2.0"
description = "Automatizacion del flujo clinico diario de Rayen APS (notas, informes y examenes)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "selenium>=4.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: tests that require a real browser",
]

# Gate de verificabilidad (Fase 4c): coverage obligatorio sobre los
# paquetes con logica de negocio. rayen/* es glue Selenium (se ejercita
# con drivers mockeados en los tests de extraccion) y queda fuera del
# gate; crear_notas/main requiere login real.
[tool.coverage.run]
source = ["src/core", "src/notas", "src/informes", "src/examenes", "src/mortadelo"]
omit = [
    # Orquestacion Selenium con login real (como rayen/*): su logica
    # deterministica vive en core/informes y si tiene tests.
    "src/informes/mes.py",
]

[tool.coverage.report]
# Ratchet (Fase 4c): arranca en el valor medido (74) para bloquear
# regresiones; objetivo 80 cuando main() de base/enriquecer tengan
# tests de integracion offline.
fail_under = 74
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv/",
    "data/",
]
